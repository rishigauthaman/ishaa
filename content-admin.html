<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Content Studio — Ishha Farha Quraishy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&family=Sora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c5a059;--ivory:#f6f3ec;--muted:rgba(246,243,236,.6);--bg:#04070c;--panel:#0a111f;--line:rgba(197,160,89,.2);--bad:#e08a8a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(60rem 50rem at 50% -15%,rgba(197,160,89,.08),transparent 70%),var(--bg);color:var(--ivory);font-family:Manrope,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px 18px 80px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap}.eyebrow{font:500 10px Sora;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}h1{font:500 clamp(2.1rem,6vw,3.8rem) 'Cormorant Garamond';margin:.35rem 0}.muted{color:var(--muted);line-height:1.7}.login,.panel{border:1px solid var(--line);background:rgba(10,17,31,.9);padding:clamp(20px,4vw,34px);border-radius:14px}.login{max-width:420px;margin:12vh auto}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 16px}.tab,.btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:11px 18px;font:600 9px Sora;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}.tab.on,.btn{background:var(--gold);border-color:var(--gold);color:#04070c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px}.wide{grid-column:1/-1}label{font:500 9px Sora;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}input,textarea{width:100%;border:1px solid var(--line);background:#060b14;color:var(--ivory);border-radius:9px;padding:12px 13px;font:14px Manrope;outline:none}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus{border-color:var(--gold)}.item{border:1px solid var(--line);padding:16px;border-radius:10px;margin-bottom:12px;background:rgba(255,255,255,.015)}.itemhead{font:500 1.25rem 'Cormorant Garamond';margin:0 0 14px}.actions{position:sticky;bottom:14px;display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.status{font-size:12px;color:var(--muted);align-self:center}.link{color:var(--gold);text-decoration:none;font:500 10px Sora;letter-spacing:.14em;text-transform:uppercase}.hide{display:none}@media(max-width:680px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.actions{flex-direction:column}.btn{width:100%}}
</style>
<style>
.visual-help{margin:0 0 16px}.visual-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.75fr);gap:16px}.preview-shell{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#020407}.preview-shell iframe{width:100%;height:68vh;border:0;background:#020407;display:block}.inspect{border:1px solid var(--line);border-radius:12px;padding:16px;background:#060b14;align-self:start;position:sticky;top:16px}.inspect h3{font:500 1.35rem 'Cormorant Garamond';margin:0 0 8px}.inspect .field{margin-top:14px}.saved{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.saved-item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(197,160,89,.1);font-size:11px;color:var(--muted)}.mini{border:1px solid var(--line);background:transparent;color:var(--gold);border-radius:999px;padding:6px 9px;cursor:pointer}.note{font-size:11px;color:var(--muted);line-height:1.55}@media(max-width:820px){.visual-grid{grid-template-columns:1fr}.inspect{position:static}.preview-shell iframe{height:58vh}}
</style>
</head><body><div class="wrap">
<div id="login" class="login"><p class="eyebrow">Private Office</p><h1>Content Studio</h1><p class="muted">Use the same access key as the booking dashboard.</p><input id="pass" type="password" placeholder="Access key"><button class="btn" id="enter" style="width:100%;margin-top:14px">Open Studio</button><p id="error" class="muted"></p></div>
<main id="app" class="hide"><div class="top"><div><p class="eyebrow">Website management</p><h1>Content Studio</h1><p class="muted">Edit the live website without touching code.</p></div><div><a class="link" href="/" target="_blank">View website ↗</a>&nbsp;&nbsp;<a class="link" href="/admin.html">Bookings</a></div></div>
<nav class="tabs"><button class="tab on" data-tab="visual">Visual Editor</button><button class="tab" data-tab="contact">Contact</button><button class="tab" data-tab="youtube">YouTube</button><button class="tab" data-tab="instagram">Instagram</button><button class="tab" data-tab="blogs">Blogs</button></nav>
<section class="panel" id="editor"></section><div class="actions"><span class="status" id="status"></span><button class="btn" id="save">Publish Changes</button></div></main>
</div><script type="text/plain" id="legacy-admin-script">
(function(){'use strict';var content=null,tab='contact',key='';function $(s){return document.querySelector(s)}function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function field(label,path,value,area){return '<div class="field '+(area?'wide':'')+'"><label>'+label+'</label>'+(area?'<textarea data-path="'+path+'">'+esc(value)+'</textarea>':'<input data-path="'+path+'" value="'+esc(value)+'">')+'</div>'}function render(){var h='';if(tab==='contact'){var c=content.contact;h='<div class="grid">'+field('Section label','contact.eyebrow',c.eyebrow)+field('Heading','contact.heading',c.heading)+field('Introductory text','contact.copy',c.copy,true)+field('Instagram URL','contact.instagram',c.instagram)+field('LinkedIn URL','contact.linkedin',c.linkedin)+field('Email address','contact.email',c.email)+'</div>'}if(tab==='youtube'){h=field('Channel URL','youtube.channel',content.youtube.channel);content.youtube.videos.forEach(function(v,i){h+='<div class="item"><p class="itemhead">Video '+(i+1)+'</p><div class="grid">'+field('YouTube video ID','youtube.videos.'+i+'.id',v.id)+field('Label','youtube.videos.'+i+'.tag',v.tag)+field('Title','youtube.videos.'+i+'.title',v.title,true)+'</div></div>'})}if(tab==='instagram'){h=field('Profile URL','instagram.profile',content.instagram.profile);content.instagram.posts.forEach(function(v,i){h+='<div class="item"><p class="itemhead">Post '+(i+1)+'</p><div class="grid">'+field('Label','instagram.posts.'+i+'.label',v.label)+field('Post or reel URL','instagram.posts.'+i+'.url',v.url)+'</div></div>'})}if(tab==='blogs'){content.blogs.forEach(function(v,i){h+='<div class="item"><p class="itemhead">Story '+(i+1)+'</p><div class="grid">'+field('Category','blogs.'+i+'.category',v.category)+field('LinkedIn URL','blogs.'+i+'.url',v.url)+field('Thumbnail path or URL','blogs.'+i+'.image',v.image)+field('Title','blogs.'+i+'.title',v.title,true)+field('Excerpt','blogs.'+i+'.excerpt',v.excerpt,true)+'</div></div>'})}$('#editor').innerHTML=h;document.querySelectorAll('[data-path]').forEach(function(el){el.addEventListener('input',function(){setPath(content,el.dataset.path,el.value)})})}function setPath(obj,path,value){var p=path.split('.'),x=obj;p.slice(0,-1).forEach(function(k){x=x[k]});x[p[p.length-1]]=value}function load(){return fetch('/api/content').then(function(r){if(!r.ok)throw Error('Could not load content');return r.json()}).then(function(d){content=d;$('#login').classList.add('hide');$('#app').classList.remove('hide');render()})}$('#enter').onclick=function(){key=$('#pass').value.trim();sessionStorage.setItem('ifq_admin_key',key);load().catch(function(e){$('#error').textContent=e.message})};document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelector('.tab.on').classList.remove('on');b.classList.add('on');tab=b.dataset.tab;render()}});$('#save').onclick=function(){var status=$('#status');status.textContent='Publishing…';fetch('/api/content',{method:'PUT',headers:{'content-type':'application/json','x-admin-key':key||sessionStorage.getItem('ifq_admin_key')||''},body:JSON.stringify({content:content})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw Error(j.error||'Save failed');return j})}).then(function(){status.textContent='Published successfully';setTimeout(function(){status.textContent=''},2500)}).catch(function(e){status.textContent=e.message})};key=sessionStorage.getItem('ifq_admin_key')||'';if(key)load().catch(function(){})})();
</script><script src="/assets/content-admin-v2.js?v=1"></script></body></html>
